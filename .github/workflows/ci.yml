name: SnapClass CI

on:
  push:
    branches: ["main", "feat/*", "fix/*"]
  pull_request:
    branches: ["main"]

jobs:
  python-tests:
    name: Logic Parity & Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg build-essential cmake

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchaudio
          pip install -r requirements.txt
          pip install -r backend/requirements.txt

      - name: Verify Zero Logic Drift
        run: bash scripts/check_logic_drift.sh

      - name: Run Root Unit & Parity Tests
        env:
          DEV_MODE: "true"
          SUPABASE_URL: "https://mock.supabase.co"
          SUPABASE_KEY: "mock-supabase-key"
          SUPABASE_SERVICE_ROLE_KEY: "mock-service-role-key"
        run: python -m unittest discover -s tests -v

      - name: Run Backend Unit Tests
        env:
          DEV_MODE: "true"
          SUPABASE_URL: "https://mock.supabase.co"
          SUPABASE_KEY: "mock-supabase-key"
          SUPABASE_SERVICE_ROLE_KEY: "mock-service-role-key"
        run: |
          cd backend
          python -m unittest discover -s tests -v

  frontend-build:
    name: Next.js Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Next.js Production Build
        run: |
          cd frontend
          npm run build
